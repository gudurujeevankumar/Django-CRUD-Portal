{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    {% include 'components/header.html' %}

    <!-- Messages Section -->
    {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="message message-{{ message.tags }}" data-message-id="{{ forloop.counter }}">
                    <span class="message-text">{{ message }}</span>
                    <button class="message-close" onclick="closeMessage(this)">×</button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <script>
        function closeMessage(button) {
            const message = button.parentElement;
            message.style.animation = 'slideOut 0.3s ease forwards';
            setTimeout(() => {
                message.remove();
            }, 300);
        }

        // Auto-dismiss messages after 5 seconds
        document.querySelectorAll('.message').forEach(msg => {
            setTimeout(() => {
                if (msg && msg.parentElement) {
                    msg.style.animation = 'slideOut 0.3s ease forwards';
                    setTimeout(() => {
                        if (msg && msg.parentElement) {
                            msg.remove();
                        }
                    }, 300);
                }
            }, 5000);
        });
    </script>

</body>
</html>
